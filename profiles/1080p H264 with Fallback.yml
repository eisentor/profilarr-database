# ─── QUALITY GROUPS ──────────────────────────────────────────────────────────
# Ordered top = most preferred. Radarr/Sonarr upgrades toward the top.
# 1080p is listed first so it is always preferred when available.
# 2160p is second — grabbed as fallback, never upgraded over an existing 1080p.
qualities:
  - id: -1
    name: 1080p Primary
    description: >
      Primary target. 1080p x264 WEB-DL and Bluray encodes.
      Radarr/Sonarr will always try to upgrade to this tier.
    qualities:
      - id: 10
        name: Bluray-1080p
      - id: 9
        name: WEBDL-1080p
      - id: 11
        name: WEBRip-1080p
      - id: 12
        name: HDTV-1080p

  - id: -4
    name: 2160p Fallback
    description: >
      4K fallback. Only grabbed when no 1080p release exists.
      Radarr/Sonarr will upgrade away from this if a 1080p appears.
    qualities:
      - id: 4
        name: Bluray-2160p
      - id: 5
        name: WEBDL-2160p
      - id: 6
        name: WEBRip-2160p

  - id: -2
    name: 720p Fallback
    description: >
      720p fallback. Only grabbed when neither 1080p nor 2160p is available.
    qualities:
      - id: 13
        name: Bluray-720p
      - id: 14
        name: WEBDL-720p
      - id: 15
        name: WEBRip-720p
      - id: 16
        name: HDTV-720p

  - id: -3
    name: SD Last Resort
    description: >
      SD last resort. Grabbed only when nothing above is available.
    qualities:
      - id: 17
        name: Bluray-576p
      - id: 18
        name: Bluray-480p
      - id: 19
        name: WEBDL-480p
      - id: 22
        name: DVD
      - id: 24
        name: SDTV

# Upgrades stop once a 1080p release is obtained
upgrade_until:
  id: -1
  name: 1080p Primary
  description: >
    Primary target. 1080p x264 WEB-DL and Bluray encodes.
    Radarr/Sonarr will always try to upgrade to this tier.

language: must_original
