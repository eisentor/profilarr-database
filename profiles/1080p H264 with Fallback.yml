  # Scores from: 1080p Balanced, 1080p Quality, 1080p Compact
  # 1080p WEB-DL (h264) scores higher than generic 1080p WEB-DL so x264
  # is always preferred over x265 when both exist at 1080p.
  - name: 1080p WEB-DL (h264)
    score: 300000           # 1080p Compact (used here to beat generic WEB-DL)
  - name: 1080p WEB-DL
    score: 280000           # 1080p Balanced (catches non-AVC / x265 WEB-DLs)
  - name: 1080p WEBRip
    score: 280000           # 1080p Quality
  - name: 1080p Bluray
    score: 280000           # 1080p Quality
  - name: 1080p HDTV
    score: 340000           # 1080p Compact

  # ── 2160p source CFs ─────────────────────────────────────────────────────
