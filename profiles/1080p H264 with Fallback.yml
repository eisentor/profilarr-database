name: 1080p H264 Primary with Wide Fallback
description: 'Targets consistent 1080p x264 WEB-DLs as the primary format. Falls
  back to 2160p WEB-DL/Bluray if no 1080p is available, then 720p, then SD.

  All scores taken directly from the eisentor/profilarr-database (stable branch).

  - Primary: 1080p x264 WEB-DL / Balanced encodes
  - Fallback 1: 2160p WEB-DL / UHD Bluray
  - Fallback 2: 720p WEB-DL / Bluray
  - Fallback 3: 576p / 480p / DVD / SDTV (SD last resort)

  x264/h264 preferred via score bonus; x265/h265 allowed as fallback within tier.
  HDR formats hard-blocked. Banned groups hard-blocked.'
tags:
- 1080p
- x264
- h264
- Balanced Focused
- Wide Fallback
- Lossy Audio
upgradesAllowed: true
minCustomFormatScore: 20000
upgradeUntilScore: 888888
minScoreIncrement: 1

# ─── CUSTOM FORMAT SCORES ────────────────────────────────────────────────────
